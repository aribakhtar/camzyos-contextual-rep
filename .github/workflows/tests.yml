name: checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -c requirements.lock -e '.[dev,eval]'
      - run: ruff check .
      - name: Validate portable database configuration
        run: docker compose config --quiet
        env:
          NEO4J_PASSWORD: ci-config-check
      - run: pytest -q
        env:
          GRAPHITI_TELEMETRY_ENABLED: 'false'
