# Non-secret behavior. Keep credentials and machine-specific paths in .env.
model: gpt-4.1-mini
embedding_model: text-embedding-3-small
embedding_dimensions: 1536
graphiti_enabled: true
max_output_tokens: 2200
retrieval_top_k: 6
retrieval_candidate_k: 20
reranking_enabled: true
# Application working budget (not the model's maximum capacity). Raw transcripts are retained.
context_window_tokens: 32000
context_safety_margin_tokens: 1024
conversation_compact_at: 0.8
conversation_summary_tokens: 1200
conversation_summary_batch_tokens: 6000
conversation_recent_messages: 6
chunk_target_chars: 1600
chunk_overlap_sentences: 1
pubmed_enabled: false
pubmed_max_results: 5
# Add PMIDs only after source review. Discovery alone does not approve evidence.
pubmed_approved_pmids: []
comparison_claims: handoff
market: DE
storage_default: false
data_dir: data
workbook: assets/hcp_context.xlsx
pdf_dir: assets/product_information
sources_file: sources.yaml
# account_id is explicitly mapped by HCP ID; never inferred from a city/workplace.
account_map: {}

