[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "camzyos-contextual-rep"
version = "0.1.0"
description = "Contextual HCP chatbot for CAMZYOS in Germany"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.50,<2", "pymupdf>=1.26,<2", "openpyxl>=3.1,<4",
  "openai>=2,<4", "pydantic>=2.11,<3", "python-dotenv>=1,<2", "tiktoken>=0.14,<1",
  "pyyaml>=6,<7", "httpx>=0.28,<1", "pysbd>=0.3.4,<1",
  "rank-bm25>=0.2.2,<1", "graphiti-core==0.31.2", "neo4j-graphrag==1.23.0"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]
# 0.4.2 removed a legacy import used by RAGAS 0.4.3.
eval = ["ragas==0.4.3", "langchain-openai>=1,<2", "langchain-community==0.4.1", "langdetect==1.0.9"]

[tool.setuptools.packages.find]
include = ["camzyos*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
extend-exclude = [".runtime", "data"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

